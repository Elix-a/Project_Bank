[tool.poetry]
name = "project-bank"
version = "0.1.0"
description = "Bank widget backend masks"
authors = ["Alexandr Romanov <elix.a@ya.ru>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
requests = "^2.34.2"
python-dotenv = "^1.2.2"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.0"
black = "^24.4.0"
isort = "^5.13.0"
mypy = "^1.10.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Конфигурация black
[tool.black]
line-length = 119
target-version = ["py313"]

# Конфигурация isort
[tool.isort]
profile = "black"
line_length = 119
skip_gitignore = false  # ← changed
skip = [".git", "__pycache__", "venv", ".venv", "build", "dist"]

# Конфигурация mypy
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true